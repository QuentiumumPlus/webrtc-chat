<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ChatZone</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div id="app">
  <!-- LOGIN -->
  <div id="loginView" class="login-view">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-circle">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
        <h1>ChatZone</h1>
        <p>Guvenli peer-to-peer mesajlasma</p>
      </div>
      <form id="loginForm">
        <input type="text" id="usernameInput" placeholder="Nickinizi girin" maxlength="16" required autofocus>
        <button type="submit" id="loginBtn"><span>Sohbete Katil</span></button>
      </form>
      <div class="login-badges">
        <span>E2E Sifreli</span>
        <span>P2P</span>
        <span>Ucretsiz</span>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div id="mainView" class="main-view hidden">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand"><div class="brand-dot"></div><span>ChatZone</span></div>
        <div class="online-badge" id="onlineCount">0</div>
      </div>
      <div class="user-list" id="userList"></div>
      <div class="sidebar-footer">
        <div class="my-avatar" id="myAvatar"></div>
        <div class="my-name" id="myName"></div>
        <div class="my-status">Cevrimici</div>
      </div>
    </aside>

    <main class="chat-area">
      <div id="emptyState" class="empty-state">
        <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="opacity:.2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <h2>Sohbete Basla</h2>
        <p>Sol panelden bir kisi secin</p>
      </div>

      <div id="chatHeader" class="chat-header hidden">
        <div class="chat-user-info">
          <div class="chat-avatar" id="chatAvatar"></div>
          <div><div class="chat-name" id="chatName"></div><div class="chat-status" id="chatStatus">Cevrimici</div></div>
        </div>
        <div class="chat-actions">
          <button class="act-btn" id="btnVoice" title="Sesli Arama">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </button>
          <button class="act-btn" id="btnVideo" title="Goruntulu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
          </button>
          <button class="act-btn" id="btnFile" title="Dosya">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
        </div>
      </div>

      <div id="messagesArea" class="messages-area hidden">
        <div id="messages" class="messages"></div>
      </div>

      <div id="chatInput" class="chat-input hidden">
        <input type="file" id="fileInput" hidden>
        <textarea id="msgInput" placeholder="Mesaj yazin..." rows="1"></textarea>
        <button class="send-btn" id="sendBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </main>

    <!-- CALL -->
    <div id="callOverlay" class="call-overlay hidden">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
      <div class="call-top">
        <div class="call-avatar" id="callAvatar"></div>
        <div class="call-name" id="callName"></div>
        <div class="call-status-text" id="callStatusText">Baglaniyor...</div>
      </div>
      <div class="call-bottom">
        <button class="cbtn" id="callMute">🎤</button>
        <button class="cbtn" id="callCam">📷</button>
        <button class="cbtn end-call" id="callEnd">📞</button>
      </div>
    </div>

    <!-- INCOMING -->
    <div id="incomingOverlay" class="incoming-overlay hidden">
      <div class="incoming-card">
        <div class="incoming-avatar" id="incAvatar"></div>
        <div class="incoming-name" id="incName"></div>
        <div class="incoming-type" id="incType">Arama...</div>
        <div class="incoming-btns">
          <button class="cbtn accept-call" id="incAccept">📞</button>
          <button class="cbtn reject-call" id="incReject">✕</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="version-tag">v2.0</div>
<script src="js/app.js"></script>
</body>
</html>
