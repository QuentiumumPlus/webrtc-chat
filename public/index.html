<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatZone</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- LOGIN -->
<div id="loginPage" class="page">
  <div class="login-box">
    <div class="logo">ChatZone</div>
    <p class="sub">Peer-to-Peer Mesajlasma</p>
    <form id="loginForm">
      <input type="text" id="nameInput" placeholder="Nickin..." maxlength="20" required autofocus>
      <button type="submit">Katil</button>
    </form>
    <div class="features">
      <span>E2E Sifreli</span>
      <span>P2P Hizli</span>
      <span>Sesli/Goruntulu</span>
    </div>
  </div>
</div>

<!-- APP -->
<div id="appPage" class="page hidden">
  <!-- SOL PANEL -->
  <aside id="sidebar">
    <div class="sb-head">
      <span class="brand">ChatZone</span>
      <span id="userCount" class="count">0 kisi</span>
    </div>
    <div id="userList" class="sb-list"></div>
    <div class="sb-foot">
      <div id="myInfo" class="my-info"></div>
    </div>
  </aside>

  <!-- ANA ALAN -->
  <main id="mainArea">
    <!-- Bos ekran -->
    <div id="emptyScreen" class="empty">
      <div class="empty-icon">💬</div>
      <h2>Sohbete Basla</h2>
      <p>Sol panelden bir kisi secin</p>
    </div>

    <!-- Sohbet ekrani -->
    <div id="chatScreen" class="hidden">
      <div class="chat-head">
        <div id="chatUser" class="chat-user"></div>
        <div class="chat-actions">
          <button id="btnVoice" class="action-btn" title="Sesli Arama">📞</button>
          <button id="btnVideo" class="action-btn" title="Goruntulu Arama">📹</button>
          <button id="btnFile" class="action-btn" title="Dosya Gonder">📎</button>
        </div>
      </div>
      <div id="messages" class="messages"></div>
      <div id="typing" class="typing hidden">yaziyor...</div>
      <div class="chat-foot">
        <input type="file" id="fileInput" hidden>
        <textarea id="msgInput" placeholder="Mesaj yazin..." rows="1"></textarea>
        <button id="btnSend">➤</button>
      </div>
    </div>

    <!-- Arama ekrani -->
    <div id="callScreen" class="hidden call-screen">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
      <div class="call-info">
        <div id="callName" class="call-name"></div>
        <div id="callStatus" class="call-status">Araniyor...</div>
      </div>
      <div class="call-btns">
        <button id="btnMute" class="call-btn">🎤</button>
        <button id="btnCam" class="call-btn">📷</button>
        <button id="btnEnd" class="call-btn end">📞</button>
      </div>
    </div>

    <!-- Gelen arama -->
    <div id="incomingCall" class="hidden incoming">
      <div class="incoming-box">
        <div id="callerName" class="caller-name"></div>
        <div class="caller-type" id="callerType">Arama...</div>
        <div class="incoming-btns">
          <button id="btnAccept" class="call-btn accept">📞</button>
          <button id="btnReject" class="call-btn reject">✕</button>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="version">v1.0 | WebRTC P2P</div>

<script src="js/app.js"></script>
</body>
</html>
